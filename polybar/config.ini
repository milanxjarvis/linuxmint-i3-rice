;==========================================================
;                    Pywal colors
;==========================================================

include-file = ~/.cache/wal/colors-polybar


;==========================================================
;                    Bar
;==========================================================

[bar/example]
width = 100%
height = 18pt
radius = 6

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator =
separator-foreground = ${colors.disabled}

font-0 = JetBrainsMonoNL NF

modules-left = logos xworkspaces 
modules-center = date
modules-right = cpu memory pulseaudio battery wlan eth power systray

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

wm-restack = i3


;==========================================================
;                    System Tray
;==========================================================

[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt


;==========================================================
;                    Linux Mint Logo
;==========================================================

[module/logos]
type = custom/text
content = "󰌽 Linux Mint+i3wm "
content-foreground = ${colors.primary}
content-padding = 1


;==========================================================
;                    Workspaces
;==========================================================

[module/xworkspaces]
type = internal/xworkspaces

label-active =  %name%
label-active-background = ${colors.background-alt}
label-active-underline = ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1


;==========================================================
;                    Window Title
;==========================================================

;[module/xwindow]
;type = internal/xwindow
;label =  %title:0:60:...%
;label-foreground = ${colors.foreground}


;==========================================================
;                    Filesystem
;==========================================================

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %mountpoint% %percentage_used%%
label-mounted-foreground = ${colors.primary}

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}


;==========================================================
;                    PulseAudio
;==========================================================

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = 󰝟 muted
label-muted-foreground = ${colors.disabled}

use-ui-max = false
interval = 5


;==========================================================
;                    Keyboard
;==========================================================

[module/xkeyboard]
type = internal/xkeyboard

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.primary}


;==========================================================
;                    Memory
;==========================================================

[module/memory]
type = internal/memory
interval = 2

format-prefix = ": "
format-prefix-foreground = ${colors.primary}

label = Used:%percentage_used:2%%


;==========================================================
;                    CPU
;==========================================================

[module/cpu]
type = internal/cpu
interval = 2

format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}

label = %percentage:2%%


;==========================================================
;                    Network
;==========================================================

[network-base]
type = internal/network
interval = 5

format-connected = <label-connected>
format-disconnected = <label-disconnected>

label-disconnected =  disconnected
label-disconnected-foreground = ${colors.disabled}


[module/wlan]
inherit = network-base
interface-type = wireless

label-connected =  %essid%
label-connected-foreground = ${colors.primary}


[module/eth]
inherit = network-base
interface-type = wired

label-connected = %ifname% %local_ip%
label-connected-foreground = ${colors.primary}


;==========================================================
;                    Date
;==========================================================

[module/date]
type = internal/date
interval = 1

date = 󰥔 %I:%M %p
date-alt = 󰥔 %Y-%m-%d %I:%M:%S %p

label = %date%
label-foreground = ${colors.primary}


;==========================================================
;                    Battery
;==========================================================

[module/battery]
type = internal/battery

full-at = 100
battery = BAT0
adapter = ADP0

poll-interval = 2

; Charging
label-charging =  %percentage%%
label-charging-foreground = ${colors.primary}


; Discharging
label-discharging =  %percentage%%
label-discharging-foreground = ${colors.primary}

; Low battery
label-low =  %percentage%%
label-low-foreground = ${colors.alert}

low-at = 20


;==========================================================
;                    Power
;==========================================================

[module/power]
type = custom/text

content = ""
content-foreground = ${colors.primary}
content-padding = 1

click-left = ~/.config/rofi/powermenu.sh


;==========================================================
;                    Settings
;==========================================================

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
